# ─────────────────────────────────────────────────────────────────────────────
# Config Nginx — conteneur livret (nginx:alpine)
#
# Servie depuis /etc/nginx/conf.d/default.conf via bind-mount.
# Le TLS, Basic Auth, redirection HTTP→HTTPS et headers de sécurité sont
# gérés par Traefik en amont. Ce fichier ne s'occupe QUE :
#   - du service de fichiers statiques
#   - du fallback SPA
#   - du cache des assets
#   - de la compression
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml application/xml+rss
                      image/svg+xml font/ttf font/otf application/wasm;

    # ── Cache long pour les assets versionnés (Vite ajoute un hash) ─────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Pas de cache sur l'index (récupération rapide des nouveaux builds) ──
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ── SPA fallback : toutes les routes inconnues retournent index.html ────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Bloquer les fichiers cachés ─────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
